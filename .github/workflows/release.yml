name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

env:
  NODE_VERSION: 24.15.0

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: get-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get-tag.outputs.tag }}
          name: ForgeDM Desktop ${{ steps.get-tag.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true

  build:
    name: Build ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-latest
            arch: arm64
            asset_name: ForgeDM-Desktop-macOS-arm64.zip
          - name: Windows-x64
            os: windows-latest
            arch: x64
            asset_name: ForgeDM-Desktop-Windows-x64.zip
          - name: Linux-x64
            os: ubuntu-latest
            arch: x64
            asset_name: ForgeDM-Desktop-Linux-x64.tar.gz
    timeout-minutes: 120
    env:
      RELEASE_CHANNEL: development
      GYP_MSVS_VERSION: 2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.arch }}
          vsversion: '2022'

      - uses: ./.github/actions/setup-ci-environment
        env:
          GYP_MSVS_VERSION: 2022
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}

      - name: Build production app
        run: yarn build:prod
        env:
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Package app (non-Windows)
        if: runner.os != 'Windows'
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Package app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Skip Squirrel packaging, just create a zip of the built app
          cd dist
          $distDir = Get-ChildItem -Directory -Filter "GitHubDesktop-win32-*" | Select-Object -First 1
          if ($distDir) {
            Compress-Archive -Path $distDir.FullName -DestinationPath "ForgeDM-Desktop-Windows-x64.zip"
          } else {
            Write-Error "No dist directory found"
            exit 1
          }
        env:
          npm_config_arch: ${{ matrix.arch }}

      # macOS: Create zip
      - name: Create macOS archive
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -ck --keepParent "GitHub Desktop-darwin-${{ matrix.arch }}/GitHub Desktop.app" "${{ matrix.asset_name }}"

      # Linux: Create tar.gz
      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf "${{ matrix.asset_name }}" desktop-linux-${{ matrix.arch }}/

      # Upload to Release
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: dist/${{ matrix.asset_name }}
          fail_on_unmatched_files: false

  publish:
    name: Publish Release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    if: always() && needs.create-release.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Check build results
        id: check-builds
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish release
        if: steps.check-builds.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: false

      - name: Keep as draft on failure
        if: steps.check-builds.outputs.publish == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: true
          body: |
            ⚠️ Build failed. Check the workflow run for details.
