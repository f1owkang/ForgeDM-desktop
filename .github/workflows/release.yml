name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

env:
  NODE_VERSION: 24.15.0

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: get-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-tag.outputs.tag }}
          name: ForgeDM Desktop ${{ steps.get-tag.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true

  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Build production app
        run: yarn build:prod
        env:
          npm_config_arch: x64
          TARGET_ARCH: x64
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          RELEASE_CHANNEL: development

      - name: Package app
        run: yarn package
        env:
          npm_config_arch: x64

      - name: Create archive
        run: |
          cd dist
          tar -czf ForgeDM-Desktop-Linux-x64.tar.gz desktop-linux-x64/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: dist/ForgeDM-Desktop-Linux-x64.tar.gz

  build-windows:
    name: Build Windows ${{ matrix.arch }}
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            asset_name: ForgeDM-Desktop-Windows-x64.exe
          - arch: arm64
            asset_name: ForgeDM-Desktop-Windows-arm64.exe
    timeout-minutes: 120
    env:
      GYP_MSVS_VERSION: 2022
      npm_config_msvs_version: 2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install dependencies
        run: yarn install
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Build production app
        run: yarn build:prod
        env:
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          RELEASE_CHANNEL: development

      - name: Package app
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Find and rename installer
        shell: pwsh
        run: |
          cd dist
          $exe = Get-ChildItem -Filter "*.exe" -Recurse | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName "${{ matrix.asset_name }}"
          } else {
            Write-Error "No .exe file found in dist directory"
            exit 1
          }

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: dist/${{ matrix.asset_name }}

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: macos-13
            asset_name: ForgeDM-Desktop-macOS-x64.zip
          - arch: arm64
            os: macos-latest
            asset_name: ForgeDM-Desktop-macOS-arm64.zip
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Build production app
        run: yarn build:prod
        env:
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          RELEASE_CHANNEL: development

      - name: Package app
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Create archive
        run: |
          cd dist
          ditto -ck --keepParent "desktop-darwin-${{ matrix.arch }}/ForgeDM Desktop.app" "${{ matrix.asset_name }}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: dist/${{ matrix.asset_name }}

  publish:
    name: Publish Release
    needs: [create-release, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: always() && needs.create-release.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Check build results
        id: check-builds
        run: |
          echo "linux=${{ needs.build-linux.result }}" >> $GITHUB_OUTPUT
          echo "windows=${{ needs.build-windows.result }}" >> $GITHUB_OUTPUT
          echo "macos=${{ needs.build-macos.result }}" >> $GITHUB_OUTPUT

          if [ "${{ needs.build-linux.result }}" = "success" ] || \
             [ "${{ needs.build-windows.result }}" = "success" ] || \
             [ "${{ needs.build-macos.result }}" = "success" ]; then
            echo "has_success=true" >> $GITHUB_OUTPUT
          else
            echo "has_success=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish release
        if: steps.check-builds.outputs.has_success == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: false

      - name: Keep as draft on failure
        if: steps.check-builds.outputs.has_success == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: true
          body: |
            ⚠️ Some builds failed. Check the workflow run for details.
            - Linux: ${{ needs.build-linux.result }}
            - Windows: ${{ needs.build-windows.result }}
            - macOS: ${{ needs.build-macos.result }}
